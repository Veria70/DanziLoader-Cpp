[package]
name = "victory-ref-backend"
description = "The reference's victory-gpu, unchanged, as a backend DLL for the milestone 4 title driver: the d3d12_xs exports and the runtime's hand-over."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
name = "victory_ref"
crate-type = ["cdylib"]

[dependencies]
victory-gpu.workspace = true
victory-formats.workspace = true
windows = { workspace = true, features = ["Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }
victory-shader.workspace = true
blake3.workspace = true
tracing-subscriber.workspace = true
