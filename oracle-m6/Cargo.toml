[package]
name = "m6-oracle"
description = "Milestone 6: the reference's victory-pe, victory-loader, victory-core and victory-hle, unchanged, as a command-line oracle: canonical dumps of what they read and make from a list of files."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "m6-oracle"
path = "src/main.rs"

[dependencies]
victory-pe.workspace = true
victory-core.workspace = true
victory-loader.workspace = true
victory-hle.workspace = true
blake3.workspace = true
anyhow.workspace = true
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }
