[package]
name = "shader-oracle"
description = "Milestone 5: the reference's victory-shader, unchanged, as a command-line oracle: a corpus of shader containers collected from title files, and canonical dumps of each translation stage and of the translation's result."
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[[bin]]
name = "shader-oracle"
path = "src/main.rs"

[dependencies]
victory-shader.workspace = true
victory-game.workspace = true
blake3.workspace = true
memchr.workspace = true
